<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Conference Registration</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="mt-5">

        <h1>Conference Registration</h1>

        <form>

            <div class="row">

                <!-- Name -->
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" id="name" name="name" class="form-control" maxlength="70" required>
                </div>

                <!-- Password -->
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <!-- Email -->
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>

                <!-- T-shirt Size -->
                <div class="col-md-6 mb-3">
                    <label for="shirt-size" class="form-label">T-shirt Size:</label>
                    <select id="shirt-size" name="shirt-size" class="form-select" required>
                        <option value="">Choose a size</option>
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>

                <!-- Date of Birth -->
                <div class="col-md-6 mb-3">
                    <label for="dob" class="form-label">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" class="form-control" required>
                </div>

                <!-- Email Updates -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Receive email updates?</label>

                    <div class="form-check">
                        <input type="radio" id="email-yes" name="email-updates" value="yes" class="form-check-input"
                            required>
                        <label for="email-yes" class="form-check-label">Yes</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" id="email-no" name="email-updates" value="no" class="form-check-input">
                        <label for="email-no" class="form-check-label">No</label>
                    </div>
                </div>

                <!-- Choose Sessions -->
                <div class="col-md-6 mb-3">
                    <label class="form-label">Choose Sessions:</label>

                    <div class="form-check">
                        <input type="checkbox" id="morning" name="sessions" value="morning" class="form-check-input">
                        <label for="morning" class="form-check-label">
                            Morning Session
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="afternoon" name="sessions" value="afternoon"
                            class="form-check-input">
                        <label for="afternoon" class="form-check-label">
                            Afternoon Session
                        </label>
                    </div>
                </div>

                <!-- Special Requests -->
                <div class="col-md-12 mb-3">
                    <label for="requests" class="form-label">
                        Special Requests:
                    </label>

                    <textarea id="requests" name="requests" class="form-control" rows="7" cols="70"></textarea>
                </div>

                <!-- Submit -->
                <div class="col-md-12">
                    <button type="button" id="register-button" class="btn btn-primary">Register</button>
                </div>

            </div>

        </form>

    </div>

    <script>

        let nameInput = document.querySelector('#name')
        let passwordInput = document.querySelector('#password')
        let emailInput = document.querySelector('#email')
        let shirtSizeInput = document.querySelector('#shirt-size')
        let dobInput = document.querySelector('#dob')
        let emailYesInput = document.querySelector('#email-yes')
        let emailNoInput = document.querySelector('#email-no')
        let morningInput = document.querySelector('#morning')
        let afternoonInput = document.querySelector('#afternoon')
        let requestsInput = document.querySelector('#requests')
        let registerButton = document.querySelector('#register-button')

        registerButton.addEventListener('click', function () {

            // Read the form values.
            let name = nameInput.value
            let password = passwordInput.value
            let email = emailInput.value
            let tShirtSize = shirtSizeInput.value
            let dateOfBirth = dobInput.value
            let receiveEmailUpdates = emailYesInput.checked
            let specialRequests = requestsInput.value

            let errors = []

            // Check that all required fields are completed.
            if (name === '') {
                errors.push('Please enter your name.')
            }

            if (password === '') {
                errors.push('Please enter your password.')
            }

            if (email === '') {
                errors.push('Please enter your email.')
            }

            if (tShirtSize === '') {
                errors.push('Please choose a T-shirt size.')
            }

            if (dateOfBirth === '') {
                errors.push('Please enter your date of birth.')
            }

            if (!emailYesInput.checked && !emailNoInput.checked) {
                errors.push('Please choose whether to receive email updates.')
            }

            if (!morningInput.checked && !afternoonInput.checked) {
                errors.push('Please select at least one session.')
            }

            // Display errors if the form is incomplete.
            if (errors.length > 0) {
                alert(errors.join('\n'))
                return
            }

            // Store the selected sessions in an array.
            let sessionsAttended = []

            if (morningInput.checked) {
                sessionsAttended.push('morning')
            }

            if (afternoonInput.checked) {
                sessionsAttended.push('afternoon')
            }

            // Create the registration object.
            let registration = {
                name: name,
                password: password,
                email: email,
                tShirtSize: tShirtSize,
                dateOfBirth: dateOfBirth,
                receiveEmailUpdates: receiveEmailUpdates,
                sessionsAttended: sessionsAttended,
                specialRequests: specialRequests
            }

            // Display the registration object in the console.
            console.log(registration)

        })

    </script>

</body>

</html>
