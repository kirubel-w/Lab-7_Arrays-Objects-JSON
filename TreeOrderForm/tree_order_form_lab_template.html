<!DOCTYPE html>
<html lang="en">

<head>
    <title>Tree Order Form</title>

    <style>
        input,
        select {
            width: 100%;
            padding: 5px;
            margin: 5px 5px 5px 0px;
            box-sizing: border-box;
        }

        input.error,
        select.error {
            border: 2px red solid;
        }
    </style>

</head>

<body>

    <h1>Minnesota Tree Order Form</h1>

    <p>Enter information to order your tree. All fields are required.</p>

    <h2>Order Information</h2>

    <label for="homeowner-name">Homeowner Name</label><input id="homeowner-name" name="homeowner-name">
    <br>
    <label for="homeowner-house-number">House Number</label><input id="homeowner-house-number"
        name="homeowner-house-number">
    <br>
    <label for="homeowner-street-name">Street Name</label><input id="homeowner-street-name"
        name="homeowner-street-name">
    <br>
    <label for="city">City</label><input id="city" name="city">
    <br>
    <!-- The state is fixed to Minnesota. -->
    <label for="state">State</label><input id="state" name="state" value="Minnesota" disabled>
    <br>
    <label for="zipcode">Zip Code</label><input id="zipcode" name="zipcode">
    <br>

    <label for="tree-type">Tree Type</label>
    <select id="tree-type">
        <option disabled selected value=""> Select a tree </option>
        <option name="tree-type">Cedar</option>
        <option name="tree-type">Maple</option>
        <option name="tree-type">Oak</option>
    </select>
    <br>

    <button id="submit-order">Submit Order</button>

    <h2>Order Summary</h2>

    <p id="order-summary"></p>

    <script>

        // Select the form elements.
        let homeownerNameInput = document.querySelector('#homeowner-name')
        let homeownerHouseNumberInput = document.querySelector('#homeowner-house-number')
        let homeownerStreetNameInput = document.querySelector('#homeowner-street-name')
        let treeTypeSelect = document.querySelector('#tree-type')
        let cityInput = document.querySelector('#city')
        let zipcodeInput = document.querySelector('#zipcode')

        let submitButton = document.querySelector('#submit-order')
        let orderSummaryParagraph = document.querySelector('#order-summary')

        submitButton.addEventListener('click', function () {

            // Get the values entered by the user.
            let name = homeownerNameInput.value
            let houseNumber = homeownerHouseNumberInput.value
            let streetName = homeownerStreetNameInput.value
            let treeType = treeTypeSelect.value
            let city = cityInput.value
            let zipcode = zipcodeInput.value

            // Store validation errors.
            let errors = []

            // Check that all required fields are completed.
            if (name === '') {
                errors.push('Please enter the homeowner name.')
            }

            if (houseNumber === '') {
                errors.push('Please enter the house number.')
            }

            if (streetName === '') {
                errors.push('Please enter the street name.')
            }

            if (city === '') {
                errors.push('Please enter the city.')
            }

            // Check that the ZIP code is numeric and within the Minnesota range.
            if (zipcode === '') {
                errors.push('Please enter the ZIP code.')
            } else if (isNaN(zipcode) || Number(zipcode) < 55001 || Number(zipcode) > 56763) {
                errors.push('Please enter a valid Minnesota ZIP code between 55001 and 56763.')
            }

            if (treeType === '') {
                errors.push('Please select a tree type.')
            }

            // Display errors and stop if the form is invalid.
            if (errors.length > 0) {
                alert(errors.join('\n'))
                return
            }

            // Display the order details when all fields are valid.
            orderSummaryParagraph.textContent = `Homeowner Name: ${name}
                                                 House Number: ${houseNumber}
                                                 Street Name: ${streetName}
                                                 City: ${city}
                                                 State: Minnesota
                                                 ZIP Code: ${zipcode}
                                                 Tree Type: ${treeType}`

        })

    </script>

</body>

</html>
